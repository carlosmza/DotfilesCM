general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    inhibit_sleep = 2  # lock notify: permite suspender solo si hay lock
}

listener {
    timeout = 280
    on-timeout = notify-send "Suspensión inminente" "El sistema se suspenderá en 20 segundos" -u critical -i system-suspend
}

# 1) 5 min inactividad → bloquear pantalla
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 2) 6 min inactividad total (1 min después del lock) → DPMS off
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 3) 15 min 20 seg → suspender (solo si hyprlock está activo)
listener {
    timeout = 920
    on-timeout = bash -c 'pidof hyprlock >/dev/null && systemctl suspend'
}
