#     brightness = 0.8
#     contrast = 1.1
# }

# Imagen de perfil centrada
image {
    monitor =
    path = ~/.config/hypr/assets/profile.png

    size = 180
    rounding = 0

    border_size = -1
    position = 0, 120
    halign = center
    valign = center
}

# Nombre del usuario
label {
    monitor =

    text = $USER
    color = rgba(FFFFFFFF)

    font_size = 28
    font_family = Azedo

    position = 0, 0
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =

    size = 320, 55

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.2

    dots_center = true

    # outer_color = rgba(88C0D0FF)
    inner_color = rgba(1E1E2EEE)
    font_color = rgba(FFFFFFFF)

    fade_on_empty = false
    placeholder_text = <i> </i>

    hide_input = false

    rounding = 12

    position = 0, -90
    halign = center
    valign = center
}

# Batería (esquina inferior izquierda)
label {
    monitor =
    font_family = Elianto

        text = cmd[update:10000] acpi -b | awk -F', ' '{print $1 " | " $2}' | sed 's/Battery 0: //'
    color = rgba(FFFFFFFF)

    font_size = 22

    position = 25, 25
    halign = left
    valign = bottom
}

# Hora (esquina inferior derecha)
label {
    monitor =
    font_family = Elianto

    text = $TIME

    color = rgba(FFFFFFFF)

    font_size = 32

    position = -25, 25
    halign = right
    valign = bottom
}
